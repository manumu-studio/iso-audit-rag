[project]
name = "iso-audit-rag"
version = "0.4.0"
description = "RAG-powered API for querying NIST SP 800-53 compliance controls with natural language."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

# asyncpg does not ship a py.typed marker / stubs as of 0.30.x.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
