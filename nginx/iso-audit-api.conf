# Nginx site: HTTP→HTTPS redirect, TLS termination, reverse proxy to uvicorn on 127.0.0.1:8000.

server {
    listen 80;
    server_name api.iso-audit.manumustudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.iso-audit.manumustudio.com;

    ssl_certificate /etc/letsencrypt/live/api.iso-audit.manumustudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.iso-audit.manumustudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
